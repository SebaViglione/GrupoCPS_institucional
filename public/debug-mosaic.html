<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Mosaico</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        .debug-container {
            max-width: 1200px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
        }
        h1 {
            color: #ef8a1e;
            text-align: center;
        }
        .debug-section {
            margin: 20px 0;
            padding: 15px;
            background: #333;
            border-radius: 5px;
        }
        .log-container {
            background: #000;
            color: #0f0;
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .mosaic-preview {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 20px;
        }
        .mosaic-debug-item {
            height: 150px;
            background: #444;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
        }
        .mosaic-debug-item .bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .mosaic-debug-item .label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            background: #ef8a1e;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #ff9a2e;
        }
    </style>
</head>
<body>
    <div class="debug-container">
        <h1>🔍 Debug del Mosaico</h1>
        
        <div class="debug-section">
            <h3>Consola de Logs</h3>
            <div id="logContainer" class="log-container">Iniciando debug...</div>
        </div>
        
        <div class="debug-section">
            <h3>Vista previa del mosaico</h3>
            <div class="mosaic-preview" id="mosaicPreview">
                <!-- Se llenará con JavaScript -->
            </div>
        </div>
        
        <div class="debug-section">
            <h3>Controles</h3>
            <div class="controls">
                <button onclick="checkIntervals()">🔍 Verificar Intervals</button>
                <button onclick="clearAllIntervals()">🗑️ Limpiar Todos los Intervals</button>
                <button onclick="reloadPage()">🔄 Recargar Página</button>
            </div>
        </div>
        
        <div class="debug-section">
            <h3>Información del Sistema</h3>
            <div id="systemInfo"></div>
        </div>
    </div>

    <!-- Cargar los mismos scripts que index.html -->
    <script src="js/i18n.min.js" defer></script>
    <script src="js/main.min.js" defer></script>

    <script>
        // Redirigir console.log a nuestro contenedor
        const logContainer = document.getElementById('logContainer');
        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;
        
        function addLog(type, message) {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${type}: ${message}\n`;
            logContainer.textContent += logEntry;
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        console.log = function(...args) {
            addLog('LOG', args.join(' '));
            originalLog.apply(console, args);
        };
        
        console.warn = function(...args) {
            addLog('WARN', args.join(' '));
            originalWarn.apply(console, args);
        };
        
        console.error = function(...args) {
            addLog('ERROR', args.join(' '));
            originalError.apply(console, args);
        };
        
        // Crear elementos del mosaico para debug
        document.addEventListener('DOMContentLoaded', function() {
            const categories = ['salud', 'educacion', 'vivienda', 'obras_publicas', 'corporativo'];
            const mosaicPreview = document.getElementById('mosaicPreview');
            
            categories.forEach(category => {
                const item = document.createElement('div');
                item.className = 'mosaic-debug-item';
                item.dataset.category = category;
                
                const bg = document.createElement('div');
                bg.className = 'bg';
                bg.dataset.image = category;
                
                const label = document.createElement('div');
                label.className = 'label';
                label.textContent = category;
                
                item.appendChild(bg);
                item.appendChild(label);
                mosaicPreview.appendChild(item);
            });
            
            // Mostrar información del sistema
            const systemInfo = document.getElementById('systemInfo');
            systemInfo.innerHTML = `
                <p><strong>User Agent:</strong> ${navigator.userAgent}</p>
                <p><strong>Plataforma:</strong> ${navigator.platform}</p>
                <p><strong>Cookies habilitadas:</strong> ${navigator.cookieEnabled ? 'Sí' : 'No'}</p>
                <p><strong>JavaScript activado:</strong> Sí</p>
                <p><strong>Hora local:</strong> ${new Date().toLocaleString()}</p>
            `;
            
            console.log('✅ Página de debug cargada');
            console.log('🔍 Monitoreando actividad del mosaico...');
        });
        
        // Funciones de control
        function checkIntervals() {
            console.log('🔍 Verificando intervals activos...');
            // No hay forma directa de listar todos los intervals, pero podemos verificar
            console.log('ℹ️ Los intervals no se pueden listar directamente en JavaScript');
        }
        
        function clearAllIntervals() {
            console.log('🗑️ Intentando limpiar todos los intervals...');
            const highestId = window.setInterval(() => {}, 0);
            let cleared = 0;
            for (let i = 0; i < highestId; i++) {
                window.clearInterval(i);
                window.clearTimeout(i);
                cleared++;
            }
            console.log(`✅ Limpiados ${cleared} intervals/timeouts`);
        }
        
        function reloadPage() {
            console.log('🔄 Recargando página...');
            location.reload();
        }
        
        // Monitorear cambios en el DOM
        const observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.type === 'attributes' && mutation.attributeName === 'style') {
                    const target = mutation.target;
                    if (target.classList.contains('bg') || target.classList.contains('mosaic-bg')) {
                        console.log('🎨 Cambio detectado en elemento de fondo:', target.style.backgroundImage || target.style.opacity);
                    }
                }
            });
        });
        
        // Configurar observer cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('.bg, .mosaic-bg').forEach(element => {
                observer.observe(element, { attributes: true, attributeFilter: ['style'] });
            });
            console.log('👀 Observer configurado para monitorear cambios en fondos');
        });
    </script>
</body>
</html>
