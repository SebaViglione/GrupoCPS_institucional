[build]
  publish = "public"

# Opcional: headers de seguridad y cache
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/web"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/web/*"
  to = "/"
  status = 302
  force = true