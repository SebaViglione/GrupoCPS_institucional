[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# --- Redirects (primer match gana; query-rules antes que las reglas .html genéricas) ---

[[redirects]]
  from = "/web"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/web/*"
  to = "/"
  status = 301
  force = true

# URLs legacy con ?lang=en -> rutas EN estáticas.
# force = true es OBLIGATORIO cuando existe un archivo en el from
# (dist/index.html): sin force, Netlify sirve el archivo y la regla es letra
# muerta. La condición de query sigue gateando el match, así que las visitas
# sin ?lang=en no se ven afectadas.
[[redirects]]
  from = "/"
  to = "/en/"
  status = 301
  force = true
  query = { lang = "en" }

[[redirects]]
  from = "/index.html"
  to = "/en/"
  status = 301
  force = true
  query = { lang = "en" }

[[redirects]]
  from = "/obras.html"
  to = "/en/obras/"
  status = 301
  query = { lang = "en" }

[[redirects]]
  from = "/estudio.html"
  to = "/en/estudio/"
  status = 301
  query = { lang = "en" }

# URLs .html indexadas -> URLs limpias
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/obras.html"
  to = "/obras/"
  status = 301

[[redirects]]
  from = "/estudio.html"
  to = "/estudio/"
  status = 301

# --- Headers ---

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Assets de build con hash en el nombre: cache inmutable
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Videos y posters con nombres versionados (-v2): cache inmutable.
# OJO: el splat cruza subdirectorios (cubre /posters/); todo archivo acá
# adentro DEBE llevar sufijo de versión en el nombre.
[[headers]]
  for = "/assets/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Para el resto (HTML incluido) rige el default de Netlify:
# ETag + max-age=0, must-revalidate. No hace falta regla propia y el
# patrón "/*.html" no es válido en headers de Netlify.

# El service worker debe poder actualizarse siempre (kill-switch)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
