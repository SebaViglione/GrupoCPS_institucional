services:
  cps_web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: cps_web
    ports:
      - "3000:80"
    volumes:
      - ../public:/var/www/html
    # Ejecutar Apache como tu usuario para evitar problemas de permisos
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - APACHE_RUN_USER=#${UID:-1000}
      - APACHE_RUN_GROUP=#${GID:-1000}
    restart: always
